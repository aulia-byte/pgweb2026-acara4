<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        var map = L.map('map').setView([1.1000097, 104.0391541], 10);

        //Basemap
        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });

        var Google_Terrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ["mt0", "mt1", "mt2", "mt3"],
            attribution: 'Google'
        });

        // Menambahkan basemap ke dalam peta
        Esri_WorldImagery.addTo(map);

        // Marker
        var marker = L.marker([1.1000097, 104.0391541]);
        var marker2 = L.marker([0.9173515, 104.5002365]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);

        // Popup
        marker.bindPopup("<b>Slmt Mlm</b><br>Kota Batam adalah sebuah kota terbesar di Provinsi Kepulauan Riau, Indonesia. Wilayah Kota Batam terdiri dari Pulau Batam, Pulau Rempang dan Pulau Galang dan pulau-pulau kecil lainnya di kawasan Selat Singapura dan Selat Malaka. Pulau Batam, Rempang, dan Galang terkoneksi oleh Jembatan Barelang. Menurut Dinas Kependudukan dan Catatan Sipil Kota Batam per 2015, jumlah penduduk Batam mencapai 1.037.187 jiwa. Batam merupakan bagian dari kawasan khusus perdagangan bebas Batam–Bintan–Karimun (BBK).");
        // marker.openPopup();

        marker2.bindPopup("Tanjung Pinang adalah ibu kota dari provinsi Kepulauan Riau, Indonesia. Kota ini terletak di Pulau Bintan dan beberapa pulau kecil seperti Pulau Dompak dan Pulau Penyengat, dengan koordinat 0º5' LU dan 104º27' BT. Kota Tanjungpinang dahulunya adalah pusat pemerintahan Kesultanan Riau-Lingga. Sebelum dimekarkan menjadi kota otonom, Tanjungpinang adalah ibu kota Kabupaten Kepulauan Riau (sekarang Kabupaten Bintan). Kota ini juga awalnya adalah ibu kota Provinsi Riau (meliputi Riau daratan dan kepulauan) sebelum dipindahkan ke Kota Pekanbaru")

        // Tooltip
        marker.bindTooltip("Batam");
        marker.openTooltip();

        marker2.bindTooltip("Tanjung Pinang");
        marker.openTooltip();


        // Circle
        var circle = L.circle([1.0505213, 103.3959389], {
            color: "red", // warna garis
            opacity: 1, // opacity garis
            fillColor: "yellow", // warna fill
            fillOpacity: 0.2, // opacity fill
            radius: 11000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Popup
        circle.bindPopup("<b>Bandar Udara Raja Haji Abdullah</b><br>Bandar Udara Raja Haji Abdullah (IATA: TJB, ICAO: WIDT) adalah bandar udara yang terletak di Desa Pamak, Kecamatan Tebing, Kabupaten Karimun, Kepulauan Riau, Indonesia. Bandar udara ini memiliki ukuran landasan pacu berukuran 1.400 x 23 m. Jarak dari kota sekitar 12 km.");
        circle.openPopup();

        circle.bindTooltip("Bandar Udara Raja Haji Abdullah", { sticky: true });
        circle.openTooltip();


        // Polyline
        var vertexPolyline = [
            [0.9232376, 104.5331097],
            [1.1207099, 104.1162300],
            [1.3426213, 103.9969254],
        ];

        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        // Popup Polyline
        polyline.bindPopup("<b>Hallo</b><br>Ini adalah popup polyline", { sticky: true });
        polyline.openPopup();

        // Tooltip Polyline
        polyline.bindTooltip("Ini adalah tooltip polyline");
        polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [0.9550102, 104.4792938],
            [0.9550102, 104.6234894],
            [1.0923838, 104.5980835],
            [1.0999392, 104.4030762]
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Popup Polygon
        polygon.bindPopup("popup polygon");
        polygon.openPopup();

        // Tooltip Polygon
        polygon.bindTooltip("tooltip polygon");
        polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "Google Terrain": Google_Terrain,
        };

        var overlayMaps = {
            "Batam": marker,
            "Tanjung Pinang": marker2,
            "Buffer Bandara": circle,
            "Line": polyline,
            "Polygon": polygon,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale

        var scale = L.control.scale({
            imperial: false,
            position: "bottomright",
        });

        scale.addTo(map);


        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);


    </script>



</body>

</html>
